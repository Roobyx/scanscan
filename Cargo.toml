[workspace]
resolver = "2"
members = [
    "crates/scanscan-core",
    "crates/scanscan-cli",
    "crates/scanscan-ipc",
]

[workspace.package]
version = "1.10.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Roobyx/scanscan"
rust-version = "1.83"

[workspace.dependencies]
scanscan-core = { path = "crates/scanscan-core" }
scanscan-ipc = { path = "crates/scanscan-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

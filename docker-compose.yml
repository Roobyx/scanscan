services:
  scanscan:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    image: scanscan/server:${SCANSCAN_TAG:-dev}
    ports:
      - "${SCANSCAN_PORT:-8080}:8080"
    environment:
      SCANSCAN_DATA_DIR: /data
      SCANSCAN_BIND: 0.0.0.0:8080
      SCANSCAN_CORE_SOCKET: /run/scanscan/scanscan.sock
      SCANSCAN_ROOTS: ${SCANSCAN_ROOTS:-/host}
      SCANSCAN_DOCKER: "true"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - scanscan-data:/data
      # Host filesystem, read-only. Override HOST_MOUNT to narrow the scope.
      - ${HOST_MOUNT:-/}:/host:ro
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # GET-only Docker socket proxy: the app never touches docker.sock directly.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      INFO: 1
      SYSTEM: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  scanscan-site:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.site
    image: scanscan/site:${SCANSCAN_TAG:-dev}
    ports:
      - "${SCANSCAN_SITE_PORT:-3300}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  scanscan-data:
